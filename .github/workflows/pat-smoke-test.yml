name: PAT smoke test

# THROWAWAY — delete this file and the branch/PR after verifying.
# Runs on push to the test branch only, so master is never involved.
on:
  push:
    branches: [test/pat-smoke]

jobs:
  pat-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Make a trivial change
        run: date > pat-smoke-marker.txt

      - name: Open PR with the PAT
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_AUTOMATION_STEPS }}
          add-paths: pat-smoke-marker.txt
          base: master
          branch: automation/pat-smoke
          delete-branch: true
          commit-message: "test: pat smoke"
          title: "test: PAT smoke check (close me)"
          body: |
            Throwaway PR to verify the automation PAT can push a branch, open a
            PR, and trigger build-and-test. Close without merging.
