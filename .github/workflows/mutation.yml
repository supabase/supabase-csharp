name: Mutation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stryker only mutates changed .cs files, so a diff without one has nothing to
  # mutate (scripts/quality-gate/changed-areas.sh).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      csharp: ${{ steps.areas.outputs.csharp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        run: ./scripts/quality-gate/changed-areas.sh "$BASE" | tee -a "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

  mutation:
    needs: changes
    if: needs.changes.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    # Ceiling, not the norm: Stryker.NET mutates everything if a non-C# file changed
    # (stryker-net#3013), so the timeout bounds that worst case.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # --since and the gate's diff both need origin/master

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Stryker
        run: dotnet tool install --global dotnet-stryker

      - name: Mutate changed packages
        env:
          # Relaxes warnings-as-errors for the instrumented build (Directory.Build.targets) and
          # compiles the E2E test files out of the test projects.
          STRYKER_MUTATION: "true"
        run: |
          git diff --name-only origin/master...HEAD -- 'packages/**/*.cs' \
            | sed -E 's#(packages/[^/]+)/.*#\1#' | sort -u \
            | while read -r pkg; do
                cfg=$(ls "$pkg"/*.Tests/stryker-config.json 2>/dev/null) || continue
                ( cd "$(dirname "$cfg")" && dotnet stryker --since:origin/master )
              done

      - name: Evaluate mutation reports
        run: ./scripts/quality-gate/gate.sh packages --mutation
