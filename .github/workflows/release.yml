name: Publish NuGet Package

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  publish:
    needs: release-please
    if: ${{ github.repository_owner == 'supabase' && (needs.release-please.outputs.releases_created == 'true'|| github.event_name == 'workflow_dispatch') }}
    name: build, pack & publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Wait for tests to succeed
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.ref }}
          check-name: build-and-test
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Restore dependencies
        run: dotnet restore

      - name: Build all packages
        run: dotnet build Supabase.sln --configuration Release --no-restore

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: supabase_publisher

      - name: Publish
        run: >
          dotnet nuget push "**/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate

  mark-api-shipped:
    needs: [release-please, publish]
    if: ${{ github.repository_owner == 'supabase' && (needs.release-please.outputs.releases_created == 'true'|| github.event_name == 'workflow_dispatch') }}
    name: mark public API shipped
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ steps.app-token.outputs.token }}

      - name: Fold Unshipped API into Shipped
        run: ./scripts/quality-gate/mark-api-shipped.sh packages

      - name: Open PR to mark shipped API
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: packages/*/PublicAPI.*.txt
          base: master
          branch: automation/mark-api-shipped
          delete-branch: true
          commit-message: "chore(quality-gate): mark public API shipped after release"
          title: "chore(quality-gate): mark public API shipped after release"
          body: |
            Folds Unshipped public API into Shipped after release ${{ needs.release-please.outputs.tag_name }}.
