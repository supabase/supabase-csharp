name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips what the diff cannot affect, decided from its files alone
  # (scripts/quality-gate/changed-areas.sh). A skipped job reports as passing.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.areas.outputs.code }}
      csharp: ${{ steps.areas.outputs.csharp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        run: ./scripts/quality-gate/changed-areas.sh "$BASE" | tee -a "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the baseline branch for the post-merge PR below
      pull-requests: write   # open the post-merge baseline-refresh PR

    steps:
      - uses: actions/checkout@v7
        with:
          # The gate's format stage diffs changed .cs files against origin/master,
          # so it needs full history rather than a shallow clone.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      # Runs the same quality gate as contributors and agents (scripts/quality-gate).
      # Its exit code is the merge gate: build/analyzers, inner-loop tests,
      # public-API sync and E2E/acceptance tests are all blocking — a non-zero exit
      # fails the job. The public-API diff (breaking changes may be intentional) and
      # the dependency-vulnerability scan (a vulnerable package may have no available
      # fix, which shouldn't wedge every PR) are signals — surfaced but non-blocking.
      #
      # The flag depends on where the change comes from:
      #   push           → --overwrite-baseline: the gate writes the improved baseline
      #                    to the runner's tree; the next step commits it. Format
      #                    stays blocking.
      #   PR from a fork → --bypass-format: a fork contributor can't always fix a
      #                    format violation themselves the way an agent can, and
      #                    format-master.yml auto-formats master after merge regardless.
      #   PR from a branch of this repository → no flag: format blocks, so the
      #                    violation is fixed before merge instead of in a format PR
      #                    after it.
      # A PR run never passes --overwrite-baseline, so it never rewrites a baseline.
      - name: Quality gate
        run: |
          if [[ "$EVENT" == "push" ]]; then
            mode="--overwrite-baseline"
          elif [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            mode="--bypass-format"
          else
            mode=""
          fi
          ./scripts/quality-gate/gate.sh packages $mode
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}

      - name: Refresh baseline on master
        if: always() && github.event_name == 'push'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_AUTOMATION_STEPS }}
          add-paths: packages/*/.gate-baseline.json
          base: master
          branch: automation/refresh-baseline
          delete-branch: true
          commit-message: "chore(quality-gate): refresh baseline after merge"
          title: "chore(quality-gate): refresh baseline after merge"
          body: |
            Refreshes the quality-gate baseline after a merge to master.

  # Validates the in-code capability annotations against the canonical matrix spec:
  # catches a mistyped feature key or a feature reported with conflicting statuses.
  capability-matrix:
    name: Validate capability annotations
    needs: changes
    if: needs.changes.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Checkout capability spec
        uses: actions/checkout@v7
        with:
          repository: supabase/sdk
          path: _sdk-spec
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate annotations against the canonical spec
        run: |
          dotnet run --project packages/CapabilityMatrix/CapabilityMatrix/CapabilityMatrix.csproj -- \
            validate --spec _sdk-spec/packages/capability-matrix/capabilities

