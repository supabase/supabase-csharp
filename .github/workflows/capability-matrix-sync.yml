name: Sync capability matrix

# Runs only on push to master. The in-code capability annotations are the source
# of truth; sdk-compliance.yaml is a generated artifact the matrix site aggregates.
#
# Annotations live only in .cs files, so a push without one skips the sync
# (scripts/quality-gate/changed-areas.sh). A change to the canonical spec in
# supabase/sdk does not push here: dispatch this workflow to pick one up.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      csharp: ${{ steps.areas.outputs.csharp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        run: ./scripts/quality-gate/changed-areas.sh "$BASE" | tee -a "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.before }}

  sync:
    needs: changes
    if: needs.changes.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Checkout capability spec
        uses: actions/checkout@v7
        with:
          repository: supabase/sdk
          path: _sdk-spec
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Regenerate sdk-compliance.yaml from capability annotations
        run: |
          dotnet run --project packages/CapabilityMatrix/CapabilityMatrix/CapabilityMatrix.csproj -- \
            generate --spec _sdk-spec/packages/capability-matrix/capabilities

      - name: Open PR with the regenerated compliance file
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_AUTOMATION_STEPS }}
          add-paths: sdk-compliance.yaml
          base: master
          branch: automation/sync-sdk-compliance
          delete-branch: true
          commit-message: "chore(capability-matrix): refresh sdk-compliance"
          title: "chore(capability-matrix): refresh sdk-compliance"
          body: |
            Regenerates `sdk-compliance.yaml` from the in-code `[ImplementedCapability]` /
            `[PartialCapability]` annotations after the last merge to master.
