name: Sync capability matrix

# Runs only on push to master. The in-code capability annotations are the source
# of truth; sdk-compliance.yaml is a generated artifact the matrix site aggregates.
on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Checkout capability spec
        uses: actions/checkout@v4
        with:
          repository: supabase/sdk
          path: _sdk-spec
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Regenerate sdk-compliance.yaml from capability annotations
        run: |
          dotnet run --project packages/CapabilityMatrix/CapabilityMatrix/CapabilityMatrix.csproj -- \
            generate --spec _sdk-spec/packages/capability-matrix/capabilities

      - name: Open PR with the regenerated compliance file
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_AUTOMATION_STEPS }}
          add-paths: sdk-compliance.yaml
          base: master
          branch: automation/sync-sdk-compliance
          delete-branch: true
          commit-message: "chore(capability-matrix): refresh sdk-compliance"
          title: "chore(capability-matrix): refresh sdk-compliance"
          body: |
            Regenerates `sdk-compliance.yaml` from the in-code `[ImplementedCapability]` /
            `[PartialCapability]` annotations after the last merge to master.
